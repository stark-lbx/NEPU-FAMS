<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - FAMS 高校固定资产管理系统</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-page h1 small { display: block; font-size: 13px; font-weight: 400; color: var(--gray-400); margin-top: 4px; }
        .form-group select { width: 100%; padding: 10px 12px; border: 1px solid var(--gray-200); border-radius: 6px; font-size: 14px; background: white; }
        .form-row { display: flex; gap: 16px; }
        .form-row .form-group { flex: 1; }
    </style>
</head>
<body>
    <div class="login-page">
        <div class="login-card" style="max-width:480px;">
            <h1>FAMS <small>用户注册</small></h1>
            <form id="register-form" onsubmit="return handleRegister(event)">
                <div class="form-group">
                    <label>用户名 <span style="color:red">*</span></label>
                    <input type="text" id="username" placeholder="请输入用户名" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label>真实姓名 <span style="color:red">*</span></label>
                    <input type="text" id="real_name" placeholder="请输入真实姓名" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>密码 <span style="color:red">*</span></label>
                        <input type="password" id="password" placeholder="请输入密码" required autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label>确认密码 <span style="color:red">*</span></label>
                        <input type="password" id="confirm_password" placeholder="请再次输入密码" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>手机号</label>
                        <input type="text" id="phone" placeholder="请输入手机号">
                    </div>
                    <div class="form-group">
                        <label>邮箱</label>
                        <input type="email" id="email" placeholder="请输入邮箱">
                    </div>
                </div>
                <div class="form-group">
                    <label>所属部门 <span style="color:red">*</span></label>
                    <select id="dept_biz_id" required>
                        <option value="">-- 请选择部门 --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>角色类型 <span style="color:red">*</span></label>
                    <select id="role_code" required>
                        <option value="teacher">老师</option>
                        <option value="student">学生</option>
                    </select>
                </div>
                <button type="submit" class="btn-login">注 册</button>
                <div class="error-msg" id="register-error"></div>
                <p style="text-align:center; margin-top:16px; font-size:13px;">
                    已有账号？<a href="index.html" style="color:var(--primary-500);">返回登录</a>
                </p>
            </form>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script>
        // Load department list on page load
        async function loadDeptList() {
            const select = document.getElementById('dept_biz_id');
            try {
                const resp = await API.request('GET', '/dept/public-list');
                if (resp.code === 200 && resp.data) {
                    resp.data.forEach(dept => {
                        const option = document.createElement('option');
                        option.value = dept.biz_id;
                        option.textContent = dept.dept_name;
                        select.appendChild(option);
                    });
                }
            } catch (e) {
                console.error('加载部门列表失败:', e);
            }
        }
        loadDeptList();

        async function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const realName = document.getElementById('real_name').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            const deptBizId = document.getElementById('dept_biz_id').value;
            const roleCode = document.getElementById('role_code').value;
            const phone = document.getElementById('phone').value.trim();
            const email = document.getElementById('email').value.trim();
            const errorEl = document.getElementById('register-error');
            errorEl.textContent = '';

            if (!username || !realName || !password || !deptBizId) {
                errorEl.textContent = '请填写所有必填项';
                return false;
            }
            if (password !== confirmPassword) {
                errorEl.textContent = '两次密码输入不一致';
                return false;
            }

            const btn = document.querySelector('.btn-login');
            btn.disabled = true;
            btn.textContent = '注册中...';

            try {
                const resp = await API.post('/user/register', {
                    username,
                    password,
                    confirm_password: confirmPassword,
                    real_name: realName,
                    dept_biz_id: deptBizId,
                    role_code: roleCode,
                    phone,
                    email
                });
                if (resp.code === 200) {
                    alert('注册成功！即将跳转到登录页。');
                    window.location.href = 'index.html';
                } else {
                    errorEl.textContent = resp.msg || '注册失败，请重试';
                }
            } catch (e) {
                errorEl.textContent = '网络错误，请确认后端服务已启动';
            } finally {
                btn.disabled = false;
                btn.textContent = '注 册';
            }
            return false;
        }
    </script>
</body>
</html>

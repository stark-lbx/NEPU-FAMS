<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAMS - 高校固定资产管理系统</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-page h1 small { display: block; font-size: 13px; font-weight: 400; color: var(--gray-400); margin-top: 4px; }
    </style>
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <h1>FAMS</h1>
            <p class="subtitle">基于多人协同的高校固定资产管理系统</p>
            <form id="login-form" onsubmit="return handleLogin(event)">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="username" placeholder="请输入用户名" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="password" placeholder="请输入密码" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-login">登 录</button>
                <div class="error-msg" id="login-error"></div>
                <p style="text-align:center; margin-top:16px; font-size:13px;">
                    还没有账号？<a href="register.html" style="color:var(--primary-500);">立即注册</a>
                </p>
            </form>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // If already logged in, redirect to main
        if (localStorage.getItem(AppConfig.TOKEN_KEY)) {
            window.location.href = 'main.html';
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('login-error');
            errorEl.textContent = '';

            if (!username || !password) {
                errorEl.textContent = '请输入用户名和密码';
                return false;
            }

            const btn = document.querySelector('.btn-login');
            btn.disabled = true;
            btn.textContent = '登录中...';

            try {
                const resp = await Auth.login(username, password);
                if (resp.code === 200) {
                    window.location.href = 'main.html';
                } else {
                    errorEl.textContent = resp.msg || '登录失败，请检查用户名密码';
                }
            } catch (e) {
                errorEl.textContent = '网络错误，请确认后端服务已启动';
            } finally {
                btn.disabled = false;
                btn.textContent = '登 录';
            }
            return false;
        }
    </script>
</body>
</html>

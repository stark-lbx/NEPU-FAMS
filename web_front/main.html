<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAMS - 高校固定资产管理系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <div class="logo-icon">F</div>
                <h2>FAMS</h2>
            </div>
            <div class="sidebar-user" id="sidebar-user" onclick="ProfilePage.show()" style="cursor:pointer;">
                <div class="avatar" id="sidebar-avatar">U</div>
                <div class="user-info">
                    <div class="user-name" id="sidebar-name">--</div>
                    <div class="user-role" id="sidebar-role">--</div>
                </div>
            </div>
            <nav class="sidebar-nav" id="sidebar-nav"></nav>
            <div class="sidebar-footer">
                <button class="btn-logout" onclick="Auth.logout()">退出登录</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="main-header">
                <h1 class="page-title" id="header-title">仪表盘</h1>
            </header>
            <div class="main-body" id="page-content">
                <div class="loading"><div class="spinner"></div>加载中...</div>
            </div>
        </main>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/permission.js"></script>
    <script src="js/router.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/pages/dashboard.js"></script>
    <script src="js/pages/assets.js"></script>
    <script src="js/pages/borrow.js"></script>
    <script src="js/pages/repair.js"></script>
    <script src="js/pages/scrap.js"></script>
    <script src="js/pages/check.js"></script>
    <script src="js/pages/flow.js"></script>
    <script src="js/pages/users.js"></script>
    <script src="js/pages/roles.js"></script>
    <script src="js/pages/dept.js"></script>
    <script src="js/pages/dict.js"></script>
    <script src="js/pages/categories.js"></script>
    <script src="js/pages/storage.js"></script>
    <script src="js/pages/profile.js"></script>

    <script>
    // Page title map
    const pageTitles = {
        dashboard: '仪表盘', assets: '固定资产台账', borrow: '资产领用管理',
        repair: '资产报修管理', scrap: '资产报废管理', check: '资产盘点管理',
        flow: '审批管理', users: '用户管理', dept: '组织机构管理', dict: '数据字典',
        categories: '资产分类', storage: '文件管理'
    };

    // Check auth first
    if (!Auth.checkAuth()) { /* redirected */ }

    // Build sidebar based on permissions
    (async function buildSidebar() {
        const user = Auth.getUser();

        // Update user info
        document.getElementById('sidebar-avatar').textContent = (user.real_name || user.username || 'U')[0].toUpperCase();
        document.getElementById('sidebar-name').textContent = user.real_name || user.username || '--';
        const roles = Auth.getRoles();
        document.getElementById('sidebar-role').textContent = roles.map(r => {
            const map = { school_admin: '超级管理员', dept_admin: '学院管理员', teacher: '教师', student: '学生' };
            return map[r.role_code] || r.role_code;
        }).join(', ');

        // 优先从 localStorage 恢复权限（避免 flicker），再请求最新权限
        const cachedPerms = localStorage.getItem(AppConfig.PERMS_KEY);
        if (cachedPerms) {
            try { Permission.load(JSON.parse(cachedPerms)); } catch(e) {}
        }

        // 使用权限系统生成侧边栏
        const navContainer = document.getElementById('sidebar-nav');
        navContainer.innerHTML = Permission.getSidebar();

        // 异步加载最新权限并刷新侧边栏
        try {
            await Auth.loadPermissions();
            navContainer.innerHTML = Permission.getSidebar();
        } catch(e) { /* 使用缓存即可 */ }
    })();

    // Init router
    Router.init();

    // Watch route changes for header title
    window.addEventListener('hashchange', () => {
        const page = Router.getCurrentPath();
        document.getElementById('header-title').textContent = pageTitles[page] || page;
    });

    // Set initial header title
    const initialPage = Router.getCurrentPath();
    document.getElementById('header-title').textContent = pageTitles[initialPage] || initialPage;
    </script>
</body>
</html>

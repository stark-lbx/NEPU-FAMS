syntax = "proto3";
package flow;

service FlowService {
  rpc CreateBorrow(CreateBorrowRequest) returns (FlowResponse);
  rpc CreateRepair(CreateRepairRequest) returns (FlowResponse);
  rpc CreateScrap(CreateScrapRequest) returns (FlowResponse);
  rpc DeptAudit(DeptAuditRequest) returns (CommonResponse);
  rpc SchoolAudit(SchoolAuditRequest) returns (CommonResponse);
  rpc GetBorrowList(GetListRequest) returns (BorrowListResponse);
  rpc GetRepairList(GetListRequest) returns (RepairListResponse);
  rpc GetScrapList(GetListRequest) returns (ScrapListResponse);
  rpc ReturnAsset(ReturnRequest) returns (CommonResponse);
  rpc GetFlowProgress(GetFlowProgressRequest) returns (FlowProgressResponse);
}

message CreateBorrowRequest {
  string asset_biz_id = 1;
  string borrow_user_biz_id = 2;
  string borrow_start_time = 3;
  string borrow_end_time = 4;
  string borrow_desc = 5;
}

message CreateRepairRequest {
  string asset_biz_id = 1;
  string report_user_biz_id = 2;
  string fault_desc = 3;
}

message CreateScrapRequest {
  string asset_biz_id = 1;
  string apply_user_biz_id = 2;
  string scrap_reason = 3;
}

message FlowResponse {
  string flow_biz_id = 1;
  string business_biz_id = 2;
}

message DeptAuditRequest {
  string flow_biz_id = 1;
  string audit_user_biz_id = 2;
  string result = 3;
}

message SchoolAuditRequest {
  string flow_biz_id = 1;
  string audit_user_biz_id = 2;
  string result = 3;
}

message CommonResponse {
  bool success = 1;
  string msg = 2;
}

message GetListRequest {
  string user_biz_id = 1;
  string dept_biz_id = 2;
}

message BorrowInfo {
  string biz_id = 1;
  string asset_biz_id = 2;
  string borrow_user_biz_id = 3;
  string borrow_start_time = 4;
  string borrow_end_time = 5;
  string borrow_status = 6;
  string flow_biz_id = 7;
}

message BorrowListResponse {
  repeated BorrowInfo list = 1;
  int32 total = 2;
}

message RepairInfo {
  string biz_id = 1;
  string asset_biz_id = 2;
  string report_user_biz_id = 3;
  string fault_desc = 4;
  string order_status = 5;
  string flow_biz_id = 6;
  string repair_user_biz_id = 7;
  string repair_cost = 8;
  string repair_result = 9;
  string report_time = 10;
  string finish_time = 11;
}

message RepairListResponse {
  repeated RepairInfo list = 1;
  int32 total = 2;
}

message ScrapInfo {
  string biz_id = 1;
  string asset_biz_id = 2;
  string apply_user_biz_id = 3;
  string scrap_reason = 4;
  string scrap_status = 5;
  string flow_biz_id = 6;
}

message ScrapListResponse {
  repeated ScrapInfo list = 1;
  int32 total = 2;
}

message ReturnRequest {
  string borrow_biz_id = 1;
  string oper_user_biz_id = 2;
}

message GetFlowProgressRequest {
  string flow_biz_id = 1;
}

message AuditStepInfo {
  string step_name = 1;
  string auditor_user_biz_id = 2;
  string result = 3;
  string audit_time = 4;
}

message FlowProgressResponse {
  repeated AuditStepInfo steps = 1;
  string final_result = 2;
}
syntax = "proto3";
package user;

// ==================== 用户服务 ====================
service UserService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc GetUserByBizId(GetUserRequest) returns (UserResponse);
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc ListUserByDept(ListUserRequest) returns (UserListResponse);
  rpc GetUserRoles(GetUserRolesRequest) returns (RoleListResponse);
  rpc ListUsersByRole(ListUsersByRoleRequest) returns (UserListResponse);
  rpc PromoteUserRole(PromoteRoleRequest) returns (CommonResponse);
  rpc UpdateUser(UpdateUserRequest) returns (CommonResponse);
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  UserInfo user = 2;
}

message UserInfo {
  string biz_id = 1;
  string username = 2;
  string real_name = 3;
  string dept_biz_id = 4;
  string phone = 5;
  string email = 6;
  int32 user_status = 7;
}

message GetUserRequest {
  string biz_id = 1;
}

message UserResponse {
  UserInfo user = 1;
}

message CreateUserRequest {
  string username = 1;
  string password = 2;
  string real_name = 3;
  string dept_biz_id = 4;
  string phone = 5;
  string email = 6;
  string role_code = 7;
}

message CreateUserResponse {
  string biz_id = 1;
}

message ListUserRequest {
  string dept_biz_id = 1;
}

message UserListResponse {
  repeated UserInfo list = 1;
  int32 total = 2;
}

message GetUserRolesRequest {
  string user_biz_id = 1;
}

message RoleInfo {
  string biz_id = 1;
  string role_name = 2;
  string role_code = 3;
}

message RoleListResponse {
  repeated RoleInfo list = 1;
}

// ==================== 部门服务 ====================
service DeptService {
  rpc GetDeptTree(GetDeptTreeRequest) returns (DeptTreeResponse);
  rpc CreateDept(CreateDeptRequest) returns (CreateDeptResponse);
  rpc UpdateDept(UpdateDeptRequest) returns (CommonResponse);
  rpc DeleteDept(DeleteDeptRequest) returns (CommonResponse);
}

message DeptInfo {
  string biz_id = 1;
  string dept_name = 2;
  string parent_biz_id = 3;
  int32 dept_sort = 4;
  repeated DeptInfo children = 5;
}

message GetDeptTreeRequest {}

message DeptTreeResponse {
  repeated DeptInfo list = 1;
}

message CreateDeptRequest {
  string dept_name = 1;
  string parent_biz_id = 2;
  int32 dept_sort = 3;
}

message CreateDeptResponse {
  string biz_id = 1;
}

message UpdateDeptRequest {
  string biz_id = 1;
  string dept_name = 2;
  int32 dept_sort = 3;
}

message DeleteDeptRequest {
  string biz_id = 1;
}

message CommonResponse {
  bool success = 1;
  string msg = 2;
}

// ==================== 字典服务 ====================
service DictService {
  rpc ListDictByType(ListDictRequest) returns (DictListResponse);
  rpc ListDictTypes(GetDictTypesRequest) returns (DictTypesResponse);
  rpc CreateDict(CreateDictRequest) returns (CreateDictResponse);
  rpc UpdateDict(UpdateDictRequest) returns (CommonResponse);
  rpc DeleteDict(DeleteDictRequest) returns (CommonResponse);
}

message DictInfo {
  string biz_id = 1;
  string dict_type = 2;
  string dict_code = 3;
  string dict_name = 4;
  int32 sort = 5;
}

message ListDictRequest {
  string dict_type = 1;
}

message DictListResponse {
  repeated DictInfo list = 1;
  int32 total = 2;
}

message CreateDictRequest {
  string dict_type = 1;
  string dict_code = 2;
  string dict_name = 3;
  int32 sort = 4;
}

message CreateDictResponse {
  string biz_id = 1;
}

message UpdateDictRequest {
  string biz_id = 1;
  string dict_name = 2;
  int32 sort = 3;
}

message DeleteDictRequest {
  string biz_id = 1;
}

message GetDictTypesRequest {}

message DictTypesResponse {
  repeated string dict_types = 1;
}

// ==================== 权限管控 ====================

message ListUsersByRoleRequest {
  string viewer_role_code = 1;
}

message PromoteRoleRequest {
  string target_biz_id = 1;
  string new_role_code = 2;
  string operator_biz_id = 3;
}

message UpdateUserRequest {
  string biz_id = 1;
  string real_name = 2;
  string phone = 3;
  string email = 4;
  string dept_biz_id = 5;
  int32 user_status = 6;
  string editor_role_code = 7;
  string editor_biz_id = 8;
}
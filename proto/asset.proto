syntax = "proto3";
package asset;

service AssetService {
  rpc CreateAsset(CreateAssetRequest) returns (CreateAssetResponse);
  rpc GetAssetByBizId(GetAssetRequest) returns (AssetResponse);
  rpc ListAssetByDept(ListAssetRequest) returns (AssetListResponse);
  rpc UpdateAssetStatus(UpdateStatusRequest) returns (CommonResponse);
  rpc GetStatusLogList(GetStatusLogRequest) returns (StatusLogListResponse);
  rpc CreateCheckTask(CreateTaskRequest) returns (TaskResponse);
  rpc SubmitCheckDetail(SubmitDetailRequest) returns (CommonResponse);
  rpc ListCheckTask(ListTaskRequest) returns (TaskListResponse);
  rpc GetCheckDetailList(GetCheckDetailRequest) returns (CheckDetailListResponse);
}

message AssetInfo {
  string biz_id = 1;
  string asset_code = 2;
  string asset_name = 3;
  string asset_type_code = 4;
  string buy_time = 5;
  double asset_price = 6;
  string store_location = 7;
  string dept_biz_id = 8;
  string current_status_code = 9;
  string use_user_biz_id = 10;
  string supplier = 11;
  string spec = 12;
  string remark = 13;
  string create_time = 14;
}

message CreateAssetRequest {
  string asset_code = 1;
  string asset_name = 2;
  string asset_type_code = 3;
  string buy_time = 4;
  double asset_price = 5;
  string store_location = 6;
  string dept_biz_id = 7;
  string current_status_code = 8;
  string use_user_biz_id = 9;
  string supplier = 10;
  string spec = 11;
  string remark = 12;
  string create_user_biz_id = 13;
}

message CreateAssetResponse {
  string biz_id = 1;
}

message GetAssetRequest {
  string biz_id = 1;
}

message AssetResponse {
  AssetInfo asset = 1;
}

message ListAssetRequest {
  string dept_biz_id = 1;
  string status_code = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message AssetListResponse {
  repeated AssetInfo list = 1;
  int32 total = 2;
}

message UpdateStatusRequest {
  string asset_biz_id = 1;
  string new_status_code = 2;
  string oper_user_biz_id = 3;
  string oper_desc = 4;
}

message CommonResponse {
  bool success = 1;
  string msg = 2;
}

// 资产状态变更日志
message GetStatusLogRequest {
  string asset_biz_id = 1;
}

message StatusLogInfo {
  string old_status_code = 1;
  string new_status_code = 2;
  string oper_user_biz_id = 3;
  string oper_desc = 4;
  string create_time = 5;
}

message StatusLogListResponse {
  repeated StatusLogInfo list = 1;
  int32 total = 2;
}

// 盘点相关
message CheckTaskInfo {
  string biz_id = 1;
  string task_name = 2;
  string target_dept_biz_id = 3;
  string start_time = 4;
  string end_time = 5;
  string task_status = 6;
  string create_user_biz_id = 7;
}

message CreateTaskRequest {
  string task_name = 1;
  string target_dept_biz_id = 2;
  string start_time = 3;
  string end_time = 4;
  string create_user_biz_id = 5;
}

message TaskResponse {
  string task_biz_id = 1;
}

message SubmitDetailRequest {
  string task_biz_id = 1;
  string asset_biz_id = 2;
  string check_user_biz_id = 3;
  int32 actual_exist = 4;
  string real_location = 5;
  string check_remark = 6;
}

message ListTaskRequest {
  string dept_biz_id = 1;
}

message TaskListResponse {
  repeated CheckTaskInfo list = 1;
  int32 total = 2;
}

message GetCheckDetailRequest {
  string task_biz_id = 1;
}

message CheckDetailInfo {
  string asset_biz_id = 1;
  string check_user_biz_id = 2;
  int32 actual_exist = 3;
  string real_location = 4;
  string check_remark = 5;
  string check_time = 6;
}

message CheckDetailListResponse {
  repeated CheckDetailInfo list = 1;
  int32 total = 2;
}